<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="Live telemetry — design metrics dashboard">
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#0c0631"/>
      <stop offset="100%" stop-color="#03030d"/>
    </linearGradient>
    <linearGradient id="cyanFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#22d3ee" stop-opacity=".7"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="violetFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#a78bfa" stop-opacity=".7"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="magentaFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#f472b6" stop-opacity=".7"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </linearGradient>
    <filter id="tg" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tg2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#a78bfa" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" fill="url(#tbg)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>

  <!-- ambient glows -->
  <circle cx="180" cy="180" r="120" fill="#22d3ee" opacity=".10" filter="url(#tg2)"/>
  <circle cx="600" cy="180" r="160" fill="#a78bfa" opacity=".12" filter="url(#tg2)"/>
  <circle cx="1020" cy="180" r="120" fill="#f472b6" opacity=".10" filter="url(#tg2)"/>

  <!-- top bar -->
  <g transform="translate(40 36)" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace">
    <text fill="#94a3b8" font-size="11" letter-spacing="6">/// LIVE TELEMETRY · DESIGN METRICS</text>
    <circle cx="180" cy="-4" r="3" fill="#22d3ee">
      <animate attributeName="opacity" values=".3;1;.3" dur="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g transform="translate(1160 36)" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" text-anchor="end">
    <text fill="#94a3b8" font-size="11" letter-spacing="3">SESSION · 2026.05 · CAIRO</text>
  </g>

  <!-- THREE PANELS -->

  <!-- Panel A: SIGNAL — animated waveform -->
  <g transform="translate(40 70)">
    <rect width="360" height="240" rx="14" fill="#0b0427" stroke="#22d3ee" stroke-opacity=".5"/>
    <text x="20" y="32" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" letter-spacing="3" fill="#94a3b8">// FRONTEND · SIGNAL</text>
    <text x="20" y="62" font-family="Inter, sans-serif" font-size="32" font-weight="700" fill="#22d3ee">98.4<tspan font-size="14" fill="#94a3b8">%</tspan></text>
    <text x="20" y="82" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" fill="#cbd5e1" letter-spacing="2">UPTIME · QUALITY · CRAFT</text>

    <!-- waveform area -->
    <path fill="url(#cyanFill)" stroke="#22d3ee" stroke-width="1.6" filter="url(#tg)"
          d="M 20 200
             L 50 180 L 80 190 L 110 160 L 140 175 L 170 140 L 200 165
             L 230 130 L 260 155 L 290 120 L 320 145 L 340 130
             L 340 220 L 20 220 Z">
      <animate attributeName="d" dur="6s" repeatCount="indefinite"
        values="
          M 20 200 L 50 180 L 80 190 L 110 160 L 140 175 L 170 140 L 200 165 L 230 130 L 260 155 L 290 120 L 320 145 L 340 130 L 340 220 L 20 220 Z;
          M 20 200 L 50 165 L 80 175 L 110 145 L 140 165 L 170 130 L 200 150 L 230 115 L 260 140 L 290 105 L 320 130 L 340 115 L 340 220 L 20 220 Z;
          M 20 200 L 50 180 L 80 190 L 110 160 L 140 175 L 170 140 L 200 165 L 230 130 L 260 155 L 290 120 L 320 145 L 340 130 L 340 220 L 20 220 Z"/>
    </path>

    <!-- Traveling indicator dot -->
    <circle r="4" fill="#22d3ee" filter="url(#tg)">
      <animate attributeName="cx" values="20;340;20" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="200;130;200" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Panel B: CORE METRICS — animated bars -->
  <g transform="translate(420 70)">
    <rect width="360" height="240" rx="14" fill="#0b0427" stroke="#a78bfa" stroke-opacity=".5"/>
    <text x="20" y="32" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" letter-spacing="3" fill="#94a3b8">// MOTION · DEPTH · CRAFT</text>

    <!-- 5 vertical bars -->
    <g transform="translate(40 100)">
      <g>
        <rect x="0" y="0" width="36" height="120" rx="6" fill="#0c0631" stroke="#a78bfa" stroke-opacity=".4"/>
        <rect x="0" y="120" width="36" height="0" rx="6" fill="url(#violetFill)">
          <animate attributeName="height" values="0;100;82;100;90" dur="4s" repeatCount="indefinite"/>
          <animate attributeName="y" values="120;20;38;20;30" dur="4s" repeatCount="indefinite"/>
        </rect>
        <text x="18" y="140" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#94a3b8">UI</text>
      </g>
      <g transform="translate(60 0)">
        <rect x="0" y="0" width="36" height="120" rx="6" fill="#0c0631" stroke="#a78bfa" stroke-opacity=".4"/>
        <rect x="0" y="120" width="36" height="0" rx="6" fill="url(#violetFill)">
          <animate attributeName="height" values="0;88;112;100;76" dur="4s" begin="-0.4s" repeatCount="indefinite"/>
          <animate attributeName="y" values="120;32;8;20;44" dur="4s" begin="-0.4s" repeatCount="indefinite"/>
        </rect>
        <text x="18" y="140" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#94a3b8">3D</text>
      </g>
      <g transform="translate(120 0)">
        <rect x="0" y="0" width="36" height="120" rx="6" fill="#0c0631" stroke="#a78bfa" stroke-opacity=".4"/>
        <rect x="0" y="120" width="36" height="0" rx="6" fill="url(#violetFill)">
          <animate attributeName="height" values="0;72;90;110;86" dur="4s" begin="-0.8s" repeatCount="indefinite"/>
          <animate attributeName="y" values="120;48;30;10;34" dur="4s" begin="-0.8s" repeatCount="indefinite"/>
        </rect>
        <text x="18" y="140" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#94a3b8">FX</text>
      </g>
      <g transform="translate(180 0)">
        <rect x="0" y="0" width="36" height="120" rx="6" fill="#0c0631" stroke="#a78bfa" stroke-opacity=".4"/>
        <rect x="0" y="120" width="36" height="0" rx="6" fill="url(#violetFill)">
          <animate attributeName="height" values="0;100;94;88;104" dur="4s" begin="-1.2s" repeatCount="indefinite"/>
          <animate attributeName="y" values="120;20;26;32;16" dur="4s" begin="-1.2s" repeatCount="indefinite"/>
        </rect>
        <text x="18" y="140" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#94a3b8">VIZ</text>
      </g>
      <g transform="translate(240 0)">
        <rect x="0" y="0" width="36" height="120" rx="6" fill="#0c0631" stroke="#a78bfa" stroke-opacity=".4"/>
        <rect x="0" y="120" width="36" height="0" rx="6" fill="url(#violetFill)">
          <animate attributeName="height" values="0;112;100;86;94" dur="4s" begin="-1.6s" repeatCount="indefinite"/>
          <animate attributeName="y" values="120;8;20;34;26" dur="4s" begin="-1.6s" repeatCount="indefinite"/>
        </rect>
        <text x="18" y="140" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#94a3b8">DATA</text>
      </g>
    </g>
  </g>

  <!-- Panel C: RADAR / PULSE -->
  <g transform="translate(800 70)">
    <rect width="360" height="240" rx="14" fill="#0b0427" stroke="#f472b6" stroke-opacity=".5"/>
    <text x="20" y="32" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" letter-spacing="3" fill="#94a3b8">// PROFILE · PULSE</text>

    <g transform="translate(180 130)">
      <!-- radar rings -->
      <circle r="20" fill="none" stroke="#f472b6" stroke-opacity=".3"/>
      <circle r="40" fill="none" stroke="#f472b6" stroke-opacity=".3"/>
      <circle r="60" fill="none" stroke="#f472b6" stroke-opacity=".3"/>
      <circle r="80" fill="none" stroke="#f472b6" stroke-opacity=".3"/>
      <line x1="-90" y1="0" x2="90" y2="0" stroke="#f472b6" stroke-opacity=".25"/>
      <line x1="0" y1="-90" x2="0" y2="90" stroke="#f472b6" stroke-opacity=".25"/>

      <!-- sweeping radar -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
        <path d="M 0 0 L 90 0 A 90 90 0 0 1 70 56 Z" fill="url(#magentaFill)" opacity=".55"/>
        <line x1="0" y1="0" x2="90" y2="0" stroke="#f472b6" stroke-width="1.5" filter="url(#tg)"/>
      </g>

      <!-- detected blips -->
      <circle cx="-50" cy="22" r="3" fill="#f472b6">
        <animate attributeName="opacity" values=".2;1;.2" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="38" cy="-44" r="3" fill="#f472b6">
        <animate attributeName="opacity" values=".2;1;.2" dur="2.1s" begin="-0.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-22" cy="-58" r="3" fill="#f472b6">
        <animate attributeName="opacity" values=".2;1;.2" dur="1.8s" begin="-1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="62" cy="32" r="3" fill="#f472b6">
        <animate attributeName="opacity" values=".2;1;.2" dur="2.4s" begin="-1.4s" repeatCount="indefinite"/>
      </circle>

      <!-- center node -->
      <circle r="5" fill="#f472b6" filter="url(#tg)"/>
    </g>
  </g>

  <!-- bottom legend bar -->
  <g transform="translate(40 332)" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" fill="#94a3b8" letter-spacing="2">
    <text x="0">FRONTEND</text>
    <text x="380">DESIGN / 3D</text>
    <text x="760">SIGNAL · INBOUND_OK</text>
    <text x="1120" text-anchor="end">— BUILD: HOLO-UI ◆</text>
  </g>

  <!-- bracket frame -->
  <g stroke="#22d3ee" stroke-width="1.4" fill="none" opacity=".55">
    <polyline points="20,20 20,60 60,60"/>
    <polyline points="1180,20 1180,60 1140,60"/>
    <polyline points="20,340 20,300 60,300"/>
    <polyline points="1180,340 1180,300 1140,300"/>
  </g>
</svg>
