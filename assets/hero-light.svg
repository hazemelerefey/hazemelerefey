<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Hazem Elerefy — Applied AI & Data Analyst">
  <title>Hazem Elerefy Hero Banner Light</title>
  <desc>Light mode hero banner for Hazem Elerefy's GitHub profile.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="360" fill="url(#bg)"/>
  <g transform="translate(600, 165)" text-anchor="middle">
    <text font-family="JetBrains Mono, monospace" font-size="58" font-weight="700" fill="#7c3aed" filter="url(#glow)">HAZEM ELEREFY</text>
    <text y="45" font-family="JetBrains Mono, monospace" font-size="18" fill="#0891b2">Applied AI & Data Analyst · Frontend-Design Craftsman</text>
    <text y="75" font-family="JetBrains Mono, monospace" font-size="14" fill="#475569">SQL · Python · Power BI · YOLO · Autonomous Agents · React · Three.js</text>
  </g>
  <line x1="80" y1="280" x2="1120" y2="280" stroke="#cbd5e1" stroke-width="2"/>
</svg>